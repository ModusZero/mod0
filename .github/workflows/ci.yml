name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend (formato, tipos, build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run check
            - run: npm run build

    backend:
        name: Backend Rust (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@v5

            - name: Dependencias de Tauri (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            # Tauri exige que exista la carpeta del frontend al compilar.
            - name: Carpeta de frontend vacía
              shell: bash
              run: mkdir -p build && touch build/index.html

            - name: Formato
              working-directory: src-tauri
              run: cargo fmt --check
            - name: Clippy
              working-directory: src-tauri
              run: cargo clippy --all-targets -- -D warnings
            - name: Pruebas
              working-directory: src-tauri
              run: cargo test
