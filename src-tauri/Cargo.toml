[package]
name = "mod0"
version = "0.3.0"
description = "Mission control para tus sesiones de CLI con IA | Mission control for your AI CLI sessions"
authors = ["Luis Alberto Hernández Roselló"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.85"

[lib]
# El sufijo `_lib` evita un conflicto de nombres con el binario en Windows.
# Ver https://github.com/rust-lang/cargo/issues/8519
name = "mod0_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
tiny_http = "0.12"
ignore = "0.4"
regex = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
